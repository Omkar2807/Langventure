version: '3'
services:
  nextjs:
    container_name: nextjs-app
    build: .
    ports:
      - "3000:3000"  # Maps container port 3000 to localhost
    volumes:
      - .:/app       # Syncs local files with the container
      - /app/node_modules  # Prevents overwriting node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
